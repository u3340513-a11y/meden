---
deployment:
  tasks:
    - echo "=== DEPLOY START ===" >> /home/isla2053/deploy.log 2>&1
    - echo "REPO_DIR=$REPO_DIR" >> /home/isla2053/deploy.log 2>&1
    - ls /home/isla2053/repositories/meden/ >> /home/isla2053/deploy.log 2>&1

    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend
    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api

    - cp -r /home/isla2053/repositories/meden/frontend/dist/. /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/
    - echo "frontend copy done" >> /home/isla2053/deploy.log 2>&1

    - rsync -a --exclude='storage/app/public' --exclude='.env' /home/isla2053/repositories/meden/backend/. /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/
    - cp /home/isla2053/repositories/meden/backend/.env.production /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/.env
    - echo "backend copy done" >> /home/isla2053/deploy.log 2>&1

    - cp -r /home/isla2053/repositories/meden/backend/public-cpanel/. /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api/
    - echo "api copy done" >> /home/isla2053/deploy.log 2>&1

    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage/logs
    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage/framework/cache
    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage/framework/sessions
    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage/framework/views
    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/bootstrap/cache
    - chmod -R 775 /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/bootstrap/cache

    - mkdir -p /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage/app/public
    - ln -sfn /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/api_backend/storage/app/public /home/isla2053/public_html/xn--medeniyetpazar-jgc.com/storage
